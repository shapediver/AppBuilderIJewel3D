blockExoticSubdeps: false

allowBuilds:
    "@parcel/watcher": false
    "@sentry/cli": true
    core-js: true
    core-js-pure: true
    esbuild: true
    unrs-resolver: true
onlyBuiltDependencies:
    - "@sentry/cli"
    - core-js
    - core-js-pure
    - esbuild
    - unrs-resolver
minimumReleaseAgeExclude:
    - "@shapediver/*"
    - "@types/webgi"
peerDependencyRules:
    allowedVersions:
        eslint-plugin-react>eslint: "10"
